<svg width="360" height="120" viewBox="0 0 360 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf0fb"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Base / línea de suelo -->
  <line x1="40" y1="96" x2="320" y2="96" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Casa moderna minimalista (dos volúmenes) -->
  <!-- Volumen bajo izquierdo -->
  <rect x="112" y="60" width="60" height="36" fill="url(#wall)"/>
  <!-- Volumen alto derecho -->
  <rect x="172" y="34" width="76" height="62" fill="url(#wall)"/>

  <!-- Techos planos con voladizo -->
  <rect x="106" y="56" width="72" height="6" rx="2" fill="#1e3a8a"/>
  <rect x="166" y="30" width="88" height="6" rx="2" fill="#1e3a8a"/>

  <!-- Ventanal grande (volumen alto) -->
  <rect x="184" y="46" width="30" height="42" rx="2" fill="url(#glass)"/>
  <line x1="199" y1="46" x2="199" y2="88" stroke="#eaf0fb" stroke-width="1.5"/>
  <line x1="184" y1="67" x2="214" y2="67" stroke="#eaf0fb" stroke-width="1.5"/>

  <!-- Ventana pequeña superior -->
  <rect x="224" y="46" width="16" height="16" rx="2" fill="url(#glass)"/>

  <!-- Puerta moderna -->
  <rect x="128" y="70" width="18" height="26" rx="1.5" fill="#1e3a8a"/>
  <line x1="142" y1="80" x2="142" y2="86" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

  <!-- Ventana volumen bajo -->
  <rect x="152" y="70" width="14" height="14" rx="2" fill="url(#glass)"/>

  <!-- Detalle vegetación minimalista -->
  <circle cx="92" cy="90" r="7" fill="#2563eb" opacity="0.35"/>
  <rect x="90" y="90" width="4" height="8" rx="2" fill="#1e3a8a" opacity="0.5"/>
</svg>
