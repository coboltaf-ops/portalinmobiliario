<svg width="360" height="180" viewBox="0 0 360 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f1b3d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbe4f5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Fondo propio para que la casa resalte -->
  <rect x="0" y="0" width="360" height="180" rx="16" fill="url(#bg)"/>

  <!-- Suelo -->
  <line x1="70" y1="140" x2="290" y2="140" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Casa moderna: dos volúmenes -->
  <!-- Volumen bajo (izquierda) -->
  <rect x="118" y="96" width="70" height="44" fill="url(#wall)" stroke="#0f1b3d" stroke-width="2"/>
  <!-- Volumen alto (derecha) -->
  <rect x="188" y="58" width="88" height="82" fill="url(#wall)" stroke="#0f1b3d" stroke-width="2"/>

  <!-- Losas / techos planos con voladizo -->
  <rect x="110" y="90" width="86" height="8" rx="2" fill="#60a5fa"/>
  <rect x="180" y="52" width="104" height="8" rx="2" fill="#60a5fa"/>

  <!-- Ventanal grande (volumen alto) -->
  <rect x="204" y="74" width="38" height="52" rx="2" fill="url(#glass)" stroke="#0f1b3d" stroke-width="1.5"/>
  <line x1="223" y1="74" x2="223" y2="126" stroke="#f8fafc" stroke-width="1.5"/>
  <line x1="204" y1="100" x2="242" y2="100" stroke="#f8fafc" stroke-width="1.5"/>

  <!-- Ventana pequeña superior -->
  <rect x="252" y="74" width="18" height="18" rx="2" fill="url(#glass)" stroke="#0f1b3d" stroke-width="1.5"/>

  <!-- Puerta moderna -->
  <rect x="132" y="110" width="22" height="30" rx="2" fill="#0f1b3d"/>
  <line x1="149" y1="121" x2="149" y2="129" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ventana volumen bajo -->
  <rect x="162" y="108" width="18" height="16" rx="2" fill="url(#glass)" stroke="#0f1b3d" stroke-width="1.5"/>

  <!-- Arbusto minimalista -->
  <circle cx="98" cy="132" r="9" fill="#3b82f6"/>
  <rect x="96" y="132" width="4" height="10" rx="2" fill="#1e3a8a"/>
</svg>
